# nginx na frente do sistema: porta 8081 do servidor → 80 aqui → app:3000.
# O HTTPS fica antes dele (proxy do servidor ou Cloudflare): ver
# docs/deploy-vps.md.

upstream next_app {
  server app:3000;
  keepalive 32;
}

# Atrás de um proxy com HTTPS, mantém o "https" que ele informou.
map $http_x_forwarded_proto $proto_original {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Envio direto de arquivos (até 25 MB) e Server Actions (até 10 MB).
  client_max_body_size 30m;

  # As sincronizações levam até 5 minutos.
  proxy_read_timeout 330s;
  proxy_send_timeout 330s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $proto_original;
  proxy_set_header X-Forwarded-Host $host;

  # Streaming do App Router (Suspense): a resposta sai sem esperar o fim.
  proxy_buffering off;

  location / {
    proxy_pass http://next_app;
  }

  # Envio de arquivo: o corpo vai direto para o Next, sem cópia em disco aqui.
  location /api/arquivos/ {
    proxy_request_buffering off;
    proxy_pass http://next_app;
  }
}
