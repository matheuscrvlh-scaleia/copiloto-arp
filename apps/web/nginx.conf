# nginx do contêiner `web`: entrega o React estático e repassa /api/ para a
# API pela rede interna do Docker. Na frente dele fica o nginx do host, que
# termina o HTTPS e manda tudo para 127.0.0.1:8081 → 80 daqui.
#
# Roda sem root (imagem nginx-unprivileged, usuário 101) e com o sistema de
# arquivos só leitura: tudo o que o nginx escreve vai para /tmp (tmpfs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Sem log de acesso: os endereços carregam tokens (links públicos, links
  # assinados de arquivo). O nginx do host já registra os acessos e a API
  # tem o log estruturado dela, sem dado sensível.
  access_log off;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  # O nginx do host fala HTTP/1.0 com este por padrão e pode mandar o
  # cabeçalho Via: sem estas duas linhas nada sairia comprimido.
  gzip_http_version 1.0;
  gzip_proxied any;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # --- Cabeçalhos por tipo de endereço -----------------------------------
  # Um `add_header` dentro de um location apaga os herdados; por isso os
  # valores são escolhidos aqui e os cabeçalhos são escritos uma vez só, no
  # server. Valor vazio = o nginx não envia o cabeçalho: é assim que as
  # respostas de /api/ saem só com os cabeçalhos que a própria API manda.

  # /api/: a API manda o próprio Cache-Control (no-store por padrão). O
  # nginx só escreve o dele quando a resposta não veio da API (502/504).
  map $upstream_http_cache_control $arp_cache_api {
    ""      "no-store";
    default "";
  }

  # A chave leva o status: cache longo só para a resposta boa. Um 404 em
  # /assets/ (aba aberta de uma versão anterior, ou pedido no meio de um
  # deploy) sai com `no-store`; guardado, o arquivo "não existiria" por um
  # ano para aquele navegador ou proxy. 304 conta como resposta boa (é a
  # revalidação do mesmo arquivo) e 206 é um pedaço dele.
  map "$status:$uri" $arp_cache {
    # Arquivos do build têm o hash do conteúdo no nome: nunca mudam.
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    ~^(200|206|304):/brand/  "public, max-age=86400";
    ~^\d+:/(assets|brand)/   "no-store";
    ~^\d+:/api/              $arp_cache_api;
    # index.html (e todo endereço de tela, que cai nele), tema.js, ícone:
    # o navegador confere a cada visita se saiu versão nova.
    default                  "no-cache";
  }

  map $uri $arp_estatico {
    ~^/api/ "";
    default 1;
  }

  # CSP: só código, estilo, fonte e chamadas da própria origem.
  # - style 'unsafe-inline': atributos style do React e as folhas de
  #   impressão embutidas de algumas telas (<style>); não libera script.
  # - img/media https: fotos que vêm de fora (Diário de Obras, eventos do
  #   site, criativos de anúncio); data:/blob: para QR code e prévias.
  # - object/frame blob: prévia de PDF escolhido no computador.
  map $arp_estatico $arp_csp {
    "" "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  }
  map $arp_estatico $arp_nosniff {
    "" "";
    default "nosniff";
  }
  map $arp_estatico $arp_referrer {
    "" "";
    default "strict-origin-when-cross-origin";
  }
  map $arp_estatico $arp_frame {
    "" "";
    default "DENY";
  }
  # Geolocalização só no próprio site: o terceirizado registra onde estava
  # ao tocar "Cheguei" e "Terminei" no link da OS (se ele permitir).
  map $arp_estatico $arp_permissoes {
    "" "";
    default "camera=(), microphone=(), geolocation=(self)";
  }
  map $arp_estatico $arp_hsts {
    "" "";
    default "max-age=63072000; includeSubDomains; preload";
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Redirecionamentos relativos: quem sabe o domínio e o https é o host.
    absolute_redirect off;

    add_header Cache-Control $arp_cache always;
    add_header Content-Security-Policy $arp_csp always;
    add_header X-Content-Type-Options $arp_nosniff always;
    add_header Referrer-Policy $arp_referrer always;
    add_header X-Frame-Options $arp_frame always;
    add_header Permissions-Policy $arp_permissoes always;
    add_header Strict-Transport-Security $arp_hsts always;

    # Saúde do contêiner (healthcheck do compose). Não depende da API.
    location = /saude-web {
      default_type text/plain;
      return 200 "ok\n";
    }

    # API: mesma origem para o navegador (cookie SameSite=Strict, sem CORS).
    # O caminho segue como veio (/api/v1/...).
    location /api/ {
      # DNS do Docker, consultado a cada pedido (variável no proxy_pass):
      # o nginx sobe mesmo com a API ainda fora do ar e acha o contêiner
      # novo depois de um deploy, sem reiniciar.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $arp_api http://api:3000;
      proxy_pass $arp_api;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # O HTTPS termina no nginx do host: o esquema é o que ele informou.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

      # Envio de arquivos: até 50 MB, direto para a API, sem gravar em disco.
      client_max_body_size 50M;
      proxy_request_buffering off;
      proxy_read_timeout 330s;
      proxy_send_timeout 330s;

      # Nada da API fica guardado aqui.
      proxy_cache off;
      proxy_buffering off;
      # Resposta em streaming (IA ARP, text/event-stream): o cabeçalho
      # X-Accel-Buffering: no da API segue para o nginx do host, que também
      # passa a entregar cada pedaço na hora (por padrão o nginx o esconde).
      proxy_pass_header X-Accel-Buffering;
    }

    # Arquivos do build: se o nome não existe (versão antiga em cache), é
    # 404 de verdade, nunca o index.html no lugar de um .js.
    location /assets/ {
      try_files $uri =404;
    }

    location /brand/ {
      try_files $uri =404;
    }

    # Todo o resto é tela do app: o React Router decide o que mostrar.
    location / {
      try_files $uri /index.html;
    }
  }
}
