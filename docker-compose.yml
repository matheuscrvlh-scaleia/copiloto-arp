# ARP Centralizador: banco, API e front.
#
#   navegador ─▶ nginx do host (HTTPS) ─▶ web (127.0.0.1:8081 → 80)
#                                          └─ /api/ ─▶ api:3000 (rede interna)
#
# Configuração: apps/api/.env (modelo em apps/api/.env.example) e
# apps/web/.env. Subir:  docker compose up -d --build
#
# - Só `web` (8081) e `api` (3001, para diagnóstico) publicam porta, e só em
#   127.0.0.1. O banco não publica porta nenhuma e fica numa rede sem saída.
# - `migrar` roda as migrations e termina; a `api` só sobe depois dele.
# - Pasta dos arquivos no host: ARQUIVOS_HOST_DIR (padrão ./dados/arquivos),
#   do uid 1000 (crie antes: mkdir -p ... && chown -R 1000:1000 ...).

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api
  build:
    context: apps/api
  image: copiloto-arp-api
  env_file: apps/api/.env
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging: *logs

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Lê POSTGRES_USER, POSTGRES_PASSWORD e POSTGRES_DB (as demais variáveis
    # do arquivo a imagem ignora).
    env_file: apps/api/.env
    # Os segredos da API não têm o que fazer no contêiner do banco.
    environment:
      JWT_CHAVE: ""
      INTEGRACOES_CHAVE: ""
      ARQUIVOS_CHAVE: ""
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
    volumes:
      - db:/var/lib/postgresql/data
    networks: [interna]
    shm_size: 256m
    # O mínimo de que a imagem oficial precisa para preparar a pasta de
    # dados e trocar para o usuário postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logs

  migrar:
    <<: *api
    command: ["node", "dist/migrar.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    healthcheck:
      disable: true

  api:
    <<: *api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ARQUIVOS_DIR: /dados/arquivos
      # A API não precisa (nem deve ter) as credenciais de administrador do
      # banco: só o `migrar` usa.
      DATABASE_ADMIN_URL: ""
      POSTGRES_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ${ARQUIVOS_HOST_DIR:-./dados/arquivos}:/dados/arquivos
    # `interna` para o banco; `externa` para o web alcançar a API e para a
    # API sair para os sistemas externos (integrações).
    networks: [interna, externa]
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/saude').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: apps/web
    image: copiloto-arp-web
    restart: unless-stopped
    env_file: apps/web/.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    networks: [externa]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logs

networks:
  # Sem saída para fora e sem acesso do host: só db, migrar e api.
  interna:
    internal: true
  externa:

volumes:
  db:
